name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pyyaml

      - name: Code Formatting Check
        run: |
          ruff check .
          black --check . --diff || true

      - name: Pytest Pure-Python Unit Tests
        run: |
          pytest tests/test_layout.py -v
